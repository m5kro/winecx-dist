name: Build winecx

on:
  workflow_dispatch:
    inputs:
      version:
        description: CrossOver source version
        required: true

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install bison ccache gettext mingw-w64 pkgconfig freetype gnutls libpcap sdl2 molten-vk vulkan-loader vulkan-headers

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: winecx-${{ inputs.version }}

      - name: Build wine
        run: ./scripts/build-wine.sh "${{ inputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: winecx ${{ inputs.version }}
          body: |
            Prebuilt macOS WineCX app bundle built from the CrossOver source archive for version ${{ inputs.version }}.

            This release includes the corresponding source archive, LGPL license text, third-party notices, and version-specific source/build information.

            WineCX Distributables is not affiliated with, sponsored by, or endorsed by CodeWeavers. CrossOver is a CodeWeavers product/mark.
          files: |
            winecx-${{ inputs.version }}-osx64.tar.gz
            crossover-sources-${{ inputs.version }}.tar.gz
            COPYING.LIB
            THIRD_PARTY_NOTICES.md
            WINECX_SOURCE.md
          fail_on_unmatched_files: true
